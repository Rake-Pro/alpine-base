name: CI

# No paths filters: the "build" check is required on dev -> main promotion PRs, so it
# must exist on every dev SHA - a filtered-out push would block promotion.
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          tags: alpine-base:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Contract checks: everything the README promises downstream images.
      - name: Smoke test image contract
        run: |
          set -euo pipefail
          run() { docker run --rm alpine-base:ci sh -euc "$1"; }
          run 'test -x /usr/bin/catatonit'
          run 'test -f /etc/ssl/certs/ca-certificates.crt'
          run 'test -f /usr/share/zoneinfo/UTC'
          run 'test "$(id -u)" = 0'
          run 'getent passwd 65534 >/dev/null'
          run 'test "$TZ" = Etc/UTC'

      - name: Trivy scan (release gate preview)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IGNOREFILE: .trivyignore.yaml
        with:
          image-ref: alpine-base:ci
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (dev)
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=dev
            type=sha,prefix=dev-,format=short

      - name: Push dev image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
