name: Weekly base rebuild

# Rebuilds and re-pushes the CURRENT latest v* tag + :latest on a schedule, so
# the image picks up Alpine security patches even with no code changes. Same
# version number - this does not mint a new release. Consumers pin the X.Y tag
# by digest; Dependabot opens the digest bump for them.
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: weekly-rebuild
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: refs/heads/main
          fetch-depth: 0

      - name: Resolve current latest version tag
        id: tag
        run: |
          set -euo pipefail
          latest=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -z "${latest}" ]; then
            echo "No v* tag found on main; nothing to rebuild." >&2
            exit 1
          fi
          echo "tag=${latest}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.tag.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.tag.outputs.tag }}
            type=sha,format=short
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (local, fresh base layers)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          pull: true
          no-cache: true
          tags: scan-target:${{ github.sha }}

      - name: Trivy scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IGNOREFILE: .trivyignore.yaml
        with:
          image-ref: scan-target:${{ github.sha }}
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true

      - name: Push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
